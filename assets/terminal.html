<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js" crossorigin="anonymous"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e2e;
        }
        #terminal {
            width: 100%;
            height: 100%;
        }
        .xterm {
            height: 100%;
        }
        .xterm-viewport {
            overflow-y: auto !important;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script>
        const term = new Terminal({
            cursorBlink: true,
            cursorStyle: 'block',
            fontSize: 14,
            fontFamily: 'monospace',
            theme: {
                background: '#1e1e2e',
                foreground: '#cdd6f4',
                cursor: '#f5e2dc',
                black: '#45475a',
                red: '#f38ba8',
                green: '#a6e3a1',
                yellow: '#f9e2af',
                blue: '#89b4fa',
                magenta: '#f5c2e7',
                cyan: '#94e2d5',
                white: '#bac2de',
                brightBlack: '#585b70',
                brightRed: '#f38ba8',
                brightGreen: '#a6e3a1',
                brightYellow: '#f9e2af',
                brightBlue: '#89b4fa',
                brightMagenta: '#f5c2e7',
                brightCyan: '#94e2d5',
                brightWhite: '#a6adc8'
            },
            allowProposedApi: true
        });

        term.open(document.getElementById('terminal'));

        let inputBuffer = '';

        term.onData(data => {
            if (typeof window.sendToPty === 'function') {
                window.sendToPty(data);
            }
        });

        term.onResize((cols, rows) => {
            if (typeof window.resizePty === 'function') {
                window.resizePty(cols, rows);
            }
        });

        window.writeToTerminal = function(data) {
            term.write(data);
        };

        window.resizeTerminal = function(cols, rows) {
            term.resize(cols, rows);
        };

        window.getTerminalSize = function() {
            return { cols: term.cols, rows: term.rows };
        };

        term.focus();
    </script>
</body>
</html>
