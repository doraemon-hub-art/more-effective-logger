<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>melogger — 编辑面板（选目标）</title>
<style>
  :root {
    /* Catppuccin Mocha */
    --crust:   #11111b;
    --mantle:  #181825;
    --base:    #1e1e2e;
    --surface0:#313244;
    --overlay0:#6c7086;
    --subtext0:#a6adc8;
    --subtext1:#bac2de;
    --text:    #cdd6f4;
    --blue:    #89b4fa;
    --green:   #a6e3a1;
    --teal:    #94e2d5;
    --red:     #f38ba8;

    --ui: "Noto Sans CJK SC", "Source Han Sans SC", "Ubuntu", sans-serif;
    --mono: "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--crust);
    font-family: var(--ui);
    color: var(--text);
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .pane {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: var(--base);
    border: 1px solid var(--blue);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(137,180,250,.35);
  }

  .pane-head {
    flex: 0 0 26px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px;
    background: #1b2133;
    border-bottom: 1px solid var(--surface0);
    font-size: 11.5px;
  }
  .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: .5px;
    padding: 1px 5px; border-radius: 3px;
    background: rgba(148,226,213,.16); color: var(--teal);
  }

  /* 弹窗在面板体里居中；头部留着，好知道这是哪个面板 */
  .modal {
    position: absolute; left: 0; right: 0; top: 27px; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(17,17,27,.55);
  }
  .card {
    width: 440px; max-width: calc(100% - 40px);
    background: var(--mantle);
    border: 1px solid var(--surface0); border-radius: 6px;
    box-shadow: 0 18px 44px rgba(0,0,0,.55);
  }
  .card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--surface0);
  }
  .card-head .spacer { flex: 1; }
  .card-head .x {
    border: 0; background: transparent; cursor: pointer;
    color: var(--overlay0); font-size: 11px;
  }
  .card-head .x:hover { color: var(--red); }
  .card-body { padding: 10px; }
  .card-foot {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    border-top: 1px solid var(--surface0);
  }
  .card-foot .spacer { flex: 1; }

  .srcs { display: flex; gap: 6px; }
  .src {
    padding: 1px 9px; border-radius: 3px;
    border: 1px solid var(--surface0); color: var(--subtext0);
    font-family: var(--mono); font-size: 10.5px; cursor: pointer;
  }
  .src.on { border-color: var(--green); color: var(--green); background: rgba(166,227,161,.1); }

  .frow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .frow + .frow { margin-top: 8px; }
  .k { flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--overlay0); }
  .in {
    padding: 2px 7px; border-radius: 3px;
    border: 1px solid var(--surface0); background: rgba(30,30,46,.6);
    font-family: var(--mono); font-size: 11px; color: var(--subtext1);
  }
  .in.ip { width: 128px; }
  .in.user { width: 100px; }
  .in.pass { width: 112px; }
  .in.port { width: 56px; }
  .in.dir { flex: 1; min-width: 160px; }

  .btn {
    padding: 1px 10px; border-radius: 4px;
    font-family: var(--mono); font-size: 10.5px;
    border: 1px solid var(--surface0); color: var(--overlay0);
    background: transparent; cursor: pointer;
  }
  .go {
    border-color: var(--green); color: var(--green);
    background: rgba(166,227,161,.12); padding: 2px 14px; font-size: 11px;
  }
</style>
</head>
<body>

  <!--
    编辑面板刚创建出来的样子：面板体里一张居中卡片，先问怎么到文件那边去。
      本地目录 —— 一行目录，回车或点「打开」；
      远程主机 —— IP / 用户名 / 密码 / 端口，点「连接」。
    卡片顶上那两格切这两种方式，底下主按钮的字跟着走。
    取消 = 关掉这个面板。这一块表单跟日志面板的远程读取是同一份组件。
  -->

  <div class="pane">
    <div class="pane-head">
      <span class="tag">EDIT</span>
    </div>

    <div class="modal">
      <div class="card">
        <div class="card-head">
          <div class="srcs">
            <span class="src" data-way="local" id="src-local">本地目录</span>
            <span class="src on" data-way="remote" id="src-remote">远程主机</span>
          </div>
          <span class="spacer"></span>
          <button type="button" class="x">✕</button>
        </div>

        <div class="card-body">
          <div class="frow" id="remote-fields">
            <span class="k">IP</span><span class="in ip">203.0.113.10</span>
            <span class="k">用户名</span><span class="in user">dev</span>
          </div>
          <div class="frow" id="remote-fields-2">
            <span class="k">密码</span><span class="in pass">dev123</span>
            <span class="k">端口</span><span class="in port">22</span>
          </div>
          <div class="frow" id="local-fields" style="display: none">
            <span class="k">目录</span><input class="in dir" id="local-dir" value="/srv/app" />
          </div>
        </div>

        <div class="card-foot">
          <span class="spacer"></span>
          <button type="button" class="btn">取消</button>
          <button type="button" class="go" id="go">连接</button>
        </div>
      </div>
    </div>
  </div>

<script>
  /* 演示用：两格切方式，主按钮跟着改字（本地是「打开」，远程是「连接」）。 */
  const go = document.getElementById("go");

  function pickWay(way) {
    document.getElementById("src-local").classList.toggle("on", way === "local");
    document.getElementById("src-remote").classList.toggle("on", way === "remote");
    document.getElementById("local-fields").style.display = way === "local" ? "flex" : "none";
    document.getElementById("remote-fields").style.display = way === "remote" ? "flex" : "none";
    document.getElementById("remote-fields-2").style.display = way === "remote" ? "flex" : "none";
    go.textContent = way === "local" ? "打开" : "连接";
  }

  document.getElementById("src-local").addEventListener("click", () => pickWay("local"));
  document.getElementById("src-remote").addEventListener("click", () => pickWay("remote"));
</script>
</body>
</html>
