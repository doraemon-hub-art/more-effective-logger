[package]
name = "melogger"
version = "0.1.0"
description = "Developer Workspace Skeleton - Tauri v2 minimal full-stack scaffold"
authors = ["doraemon-hub-art"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
