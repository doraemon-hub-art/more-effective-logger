[package]
name = "more-effective-logger"
version = "0.1.0"
edition = "2021"

[dependencies]
ssh2 = "0.9"
regex = "1"
slint = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
dirs = "5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4"

[build-dependencies]
slint-build = "1"
